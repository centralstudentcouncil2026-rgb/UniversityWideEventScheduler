<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CONNECT public university organization calendar">
  <title>CONNECT | Public Calendar</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../style.css?v=20260607-mobile-drawer-v1">
  <link rel="stylesheet" href="../csc-live-theme.css?v=20260607-mobile-drawer-v1">
  <link rel="stylesheet" href="../connect-calendar-overrides.css?v=20260607-mobile-drawer-v1">
  <link rel="stylesheet" href="../connect-portal-pages.css?v=20260607-mobile-drawer-v1">
</head>
<body class="public-shell is-public">
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-area">
        <button class="icon-button mobile-only" id="mobileMenuButton" aria-label="Open menu"><span></span><span></span><span></span></button>
        <img class="brand-logo" src="../assets/csc-logo.png" alt="CSC logo">
        <div class="brand-copy">
          <h1>CONNECT</h1>
          <p class="brand-tagline-grid"><span>Centralized Organization Network</span><span>News • Events • Coordination • Timely Updates</span></p>
        </div>
      </div>
      <nav class="calendar-nav" aria-label="Calendar navigation">
        <button class="toolbar-button" id="todayButton">Today</button>
        <button class="icon-button" id="prevButton" aria-label="Previous period">&#8249;</button>
        <button class="icon-button" id="nextButton" aria-label="Next period">&#8250;</button>
        <h2 id="calendarTitle">Calendar</h2>
        <select id="publicViewSelector" class="view-selector" aria-label="Calendar view">
          <option value="dayGridMonth">Month</option>
          <option value="multiMonthYear">Year</option>
        </select>
      </nav>
    </header>

    <aside class="sidebar" id="sidebar">
      <section class="sidebar-section announcement-preview">
        <span class="section-label">Announcements</span>
        <div id="announcementPreview"></div>
      </section>

      <section class="sidebar-section status-card">
        <span class="section-label">Incampus & Offcampus</span>
        <strong>Coordinator Status</strong>
        <span class="status-value" id="officeStatusValue">Status not posted</span>
      </section>

      <section class="sidebar-section status-card">
        <span class="section-label">CSC President</span>
        <strong>Active Status</strong>
        <span class="status-value" id="presidentStatusValue">Status not posted</span>
      </section>
    </aside>

    <main class="calendar-panel"><div id="calendar"></div></main>
    <div class="mobile-scrim" id="mobileScrim"></div>
  </div>

  <div class="public-day-dialog" id="publicDayDialog" role="dialog" aria-label="Selected day events" aria-hidden="true">
    <div class="public-day-header">
      <div><span class="section-label" id="publicDayCount">Selected Date</span><h3 id="publicDayTitle">Events</h3></div>
      <button type="button" class="icon-button" id="closePublicDayDialog" aria-label="Close selected day events">&times;</button>
    </div>
    <div class="public-day-events" id="publicDayEvents"></div>
  </div>

  <script src="../assets/fullcalendar-6.1.15.global.min.js?v=20260605-local-calendar-v1"></script>
  <script src="../assets/fullcalendar-global-shim.js?v=20260605-local-calendar-v1"></script>
  <script src="../supabaseClient.js?v=20260607-mobile-drawer-v1"></script>
  <script type="module" src="../public-calendar.js?v=20260607-mobile-drawer-v1"></script>
</body>
</html>
