<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSC S.Y.N.C. — Systemized Year-round Network Calendar student organization login">
  <title>CSC S.Y.N.C. — Systemized Year-round Network Calendar | Student Organization Login</title>
  <link rel="preconnect" href="https://lcmyqhyxtipzovmgbdtf.supabase.co">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../style.css?v=20260619-detail-actions-v1">
  <link rel="stylesheet" href="../csc-live-theme.css?v=20260607-performance-v1">
  <link rel="stylesheet" href="../connect-portal-pages.css?v=20260619-login-scroll-v1">
</head>
<body class="auth-active auth-screen login-page" data-login-type="student" data-portal-href="../portal.html">
  <header class="auth-brand">
    <img class="brand-logo" src="../assets/csc-logo.png?v=20260607-performance-v1" alt="CSC logo">
    <div>
      <h1>CSC S.Y.N.C.</h1>
      <p>Systemized Year-round Network Calendar</p>
    </div>
  </header>

  <main class="auth-layout" aria-label="Student organization login">
    <section class="auth-card login-card">
      <span class="login-kind-badge">Student Organization Portal</span>
      <h2>Student Organization Login</h2>

      <div class="auth-tabs" role="tablist" aria-label="Organization account access">
        <button class="auth-tab-button active" type="button" role="tab" aria-selected="true" aria-controls="loginPanel" data-auth-tab="login">Login</button>
        <button class="auth-tab-button" type="button" role="tab" aria-selected="false" aria-controls="signupPanel" data-auth-tab="signup">Sign Up</button>
      </div>

      <div class="auth-tab-panel active" id="loginPanel" role="tabpanel" data-auth-panel="login">
        <form class="auth-form" id="pageLoginForm">
          <label>AUP Email
            <input id="loginUsername" type="email" required autocomplete="email" maxlength="160" placeholder="name@aup.edu.ph" autofocus>
          </label>
          <label>Password
            <input id="loginPassword" type="password" required autocomplete="current-password" maxlength="128">
          </label>
          <button class="primary-button" type="submit">Open Student Organization Portal</button>
        </form>
        <p class="login-message" id="loginMessage" aria-live="polite"></p>
      </div>

      <div class="auth-tab-panel" id="signupPanel" role="tabpanel" data-auth-panel="signup" hidden>
        <form class="auth-form signup-form" id="organizationSignupForm">
          <label>AUP Email
            <input id="signupAupEmail" type="email" required autocomplete="email" maxlength="160" placeholder="name@aup.edu.ph">
          </label>
          <label>Phone Number
            <input id="signupPhone" required inputmode="numeric" minlength="11" maxlength="11" pattern="[0-9]{11}">
          </label>
          <label>Organization Name
            <input id="signupOrganization" required maxlength="140">
          </label>
          <label>Name
            <input id="signupUsername" required autocomplete="name" maxlength="120">
          </label>
          <label>Password
            <input id="signupPassword" type="password" minlength="10" maxlength="128" required autocomplete="new-password">
          </label>
          <button class="secondary-button" type="submit">Submit for Admin Approval</button>
        </form>
        <p class="login-message" id="signupMessage" aria-live="polite"></p>
      </div>

      <div class="login-footer-links">
        <a href="../public/">Back to public calendar</a>
      </div>
    </section>
  </main>

  <script src="../supabaseClient.js?v=20260616-csc-sync-brand-v1"></script>
  <script type="module" src="../login.js?v=20260619-admin-session-v1"></script>
</body>
</html>
